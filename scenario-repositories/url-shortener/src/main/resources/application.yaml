spring:
  application:
    name: url-shortener

  datasource:
    url: jdbc:h2:mem:url_shortener;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8090
  shutdown: graceful