spring:
  application:
    name: agentic-software-engineer

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agentic_software_engineer}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

  metrics:
    tags:
      application: ${spring.application.name}

agentic:
  model:
    provider: ${MODEL_PROVIDER:deterministic}
    base-url: ${MODEL_BASE_URL:https://api.openai.com/v1}
    api-key: ${MODEL_API_KEY:}
    model: ${MODEL_NAME:gpt-4.1-mini}
    timeout: ${MODEL_TIMEOUT:PT60S}
    max-output-tokens: ${MODEL_MAX_OUTPUT_TOKENS:8000}

  workspace:
    root: ${AGENT_WORKSPACE_ROOT:./agent-workspaces}

  repository:
    allowed-root: ${AGENT_REPOSITORY_ROOT:./scenario-repositories}
    max-files: ${AGENT_MAX_FILES:2000}
    max-file-size-bytes: ${AGENT_MAX_FILE_SIZE_BYTES:1048576}
    max-context-characters: ${AGENT_MAX_CONTEXT_CHARACTERS:200000}

  execution:
    max-attempts: ${AGENT_MAX_ATTEMPTS:2}
    command-timeout: ${AGENT_COMMAND_TIMEOUT:PT120S}
    max-output-characters: ${AGENT_MAX_OUTPUT_CHARACTERS:100000}
    max-patch-files: ${AGENT_MAX_PATCH_FILES:30}
    max-patch-bytes: ${AGENT_MAX_PATCH_BYTES:524288}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [correlationId=%X{correlationId:-}] %logger{36} - %msg%n"